[build]
  command = "yarn build"
  publish = "excalidraw-app/build"

[build.environment]
  NODE_VERSION = "22"
  YARN_VERSION = "1.22.22"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
